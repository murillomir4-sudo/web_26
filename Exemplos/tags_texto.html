<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tags de Texto</title>
</head>
<body>

<h1> 🫠 </h1>
<h2> 🫠 </h2>
<h3> 🫠 </h3>
<h4> 🫠 </h4>
<h5> 🫠</h5>
<h6> 🫠 </h6>
<!--HR É PARA CRIAR UMA LINHA HORIZONTAL-->
<hr>
<p>Este é um paragrafo</p>
<hr>

<!--ESTE É UM COMENTARIO (ctrl + / )-->
<p>
<!--BR É PARA QUEBRAR A LINHA, PODE SER USADO MAIS DE 1 PARA QUEBRAR MAIS LINHAS-->
    primeira linha<br><br>
    segunda linha
</p>
<hr>

<h2>Lista Não Ordenada</h2>
<ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ul>

<h2>Lista Ordenada</h2>
<ol>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
</ol>
<hr>
<!--<a> define o nome aonde a pessoa vai clicar e dentro dele o href é usado para colocar o link desejado-->
<a href="https://www.google.com" title="clique aqui para saber mais">Google</a><br>
<!--target pode abrir uma nova guia-->
<a href="https://www.google.com" target="_blank">Google nova aba</a>

</body>
</html>
