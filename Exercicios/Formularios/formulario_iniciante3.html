<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario3</title>
</head>
<body>
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
    <br>
    <label>
        Empresa:
        <input name="form_empresa" type="text" placeholder="Digite sua empresa" required>
    </label>
    <br>
    <br>
    <label>Idade:</label>
    <br>

    <label>
        <input name="form_idade" value="1" type="radio" required>
        10-20anos

    </label>

    <label>
        <input name="form_idade" value="2" type="radio" required>
        20-30anos

    </label>

    <label>
        <input name="form_idade" value="3" type="radio" required>
        30-50anos

    </label>

    <label>
        <input name="form_idade" value="4" type="radio" required>
        50-80anos

    </label>
    <br>
    <br>
    <label>
        Email:
        <input name="form_email" type="email" placeholder="Digite seu Email" required>
    </label>
    <br>
    <br>
    <label>
        Telefone comercial:
        <input name="form_telefone" type="tel" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="18-12345-6789" required>

    </label>

    <label>
        Celular:
        <input name="form_celular" type="tel" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="18-12345-6789" required>
    </label>
   <br>
   <br>
    <label>Como você avalia os nossos serviços atualmente?</label>
    <br>

    <label>
        <input name="form_avalia" value="1" type="radio" required>
        Regular

    </label>

    <label>
        <input name="form_avalia" value="2" type="radio" required>
        Bom

    </label>

    <label>
        <input name="form_avalia" value="3" type="radio" required>
        Exelente
    <br>
    <br>
         <label>Como você avalia os serviços da área operacional?</label>
    <br>

    <label>
        <input name="form_avalia2" value="1" type="radio" required>
        Regular

    </label>

    <label>
        <input name="form_avalia2" value="2" type="radio" required>
        Bom

    </label>


    <label>
        <input name="form_avalia2" value="3" type="radio" required>
        Exelente
    <br>
    <br>
        <label>Qual nivel de satisfação com o atendimento administrativo quando você precisa?</label>
    <br>

    <label>
        <input name="form_avalia3" value="1" type="radio" required>
        Pouco Satisfatorio

    </label>

    <label>
        <input name="form_avalia3" value="2" type="radio" required>
        Satisfatorio

    </label>

    <label>
        <input name="form_avalia3" value="3" type="radio" required>
        Muito Satisfatorio
    <br>
    <br>
     <label>Os profissionais te atendem de forma satisfatoria?</label>
    <br>

    <label>
        <input name="form_avalia4" value="1" type="radio" required>
        Não

    </label>

    <label>
        <input name="form_avalia4" value="2" type="radio" required>
        Sim
    <br>
    <br>
        <label>
        Você tem alguma sugestão ou critica a fazerpara cada vez mais melhorarmos nossos serviços?:
        <br>
        <textarea name="from_descrição" rows="10" cols="80" required></textarea>
        </label>
        <br>

<button type="submit">Enviar</button>
    <button type="reset">Redefinir</button>
</form>
</body>
</html>
