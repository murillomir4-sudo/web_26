<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario1</title>
</head>
<body>
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
    <br>
    <label>
        Email:
        <input name="form_email" type="email" placeholder="Digite seu Email" required>
    </label>
    <br>
    <br>
    <label>
        Assunto:
        <input name="form_assunto" type="text" placeholder="Coloque seu assunto" >
    </label>
<br>
<br>
    <label>
        Mensagem:
        <br>
        <textarea name="from_mensagem" rows="10" cols="20"></textarea>
    </label>
    <br>
    <button type="submit">Enviar</button>
    <button type="reset">Redefinir</button>


</form>
</body>
</html>
